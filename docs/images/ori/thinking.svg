<svg xmlns="http://www.w3.org/2000/svg" class="ori  " viewBox="0 0 400 400" width="240" height="240" role="img" aria-label="Ori thinking"><title>Ori thinking</title><style>.ori { display: block; overflow: visible; flex: none; } .ori g, .ori circle, .ori path, .ori rect, .ori text, .ori ellipse { transform-box: view-box; } .ori-bob { animation: ori-bob 3.4s ease-in-out infinite; } .ori-hop { animation: ori-hop 0.62s cubic-bezier(0.3, 1.5, 0.5, 1) infinite alternate; } .ori-breathe { transform-origin: 200px 290px; animation: ori-breathe 3.8s ease-in-out infinite; } .ori-shake { transform-origin: 200px 300px; animation: ori-shake 2.6s ease-in-out infinite; } .ori-aura { transform-origin: 200px 200px; animation: ori-aura 4.6s ease-in-out infinite; } .ori-blink { transform-origin: 200px 190px; animation: ori-blink 5.2s infinite; } .ori-wave { transform-origin: 0px 22px; animation: ori-wave 0.5s ease-in-out infinite alternate; } .ori-cheer { animation: ori-cheer 0.62s cubic-bezier(0.3, 1.5, 0.5, 1) infinite alternate; } .ori-tap { animation: ori-tap 0.36s ease-in-out infinite alternate; } .ori-tap2 { animation-delay: 0.18s; } .ori-glow { transform-origin: 201px 214px; animation: ori-glowp 1.8s ease-in-out infinite; } .ori-peer { animation: ori-peer 3s ease-in-out infinite; } .ori-scan { transform-origin: 240px 180px; animation: ori-scan 4s ease-in-out infinite; } .ori-scribble { animation: ori-scribble 0.9s ease-in-out infinite; } .ori-present { transform-origin: 330px 190px; animation: ori-present 2.4s ease-in-out infinite; } .ori-flash { transform-origin: 345px 90px; animation: ori-flash 2.2s ease-out infinite; } .ori-flag { transform-origin: 338px 82px; animation: ori-flag 0.45s ease-in-out infinite alternate; } .ori-pulse { animation: ori-pulse 1.4s ease-in-out infinite; } .ori-dot { animation: ori-dot 1.3s ease-in-out infinite; } .ori-d2 { animation-delay: 0.2s; } .ori-d3 { animation-delay: 0.4s; } .ori-spark { transform-box: fill-box; transform-origin: center; animation: ori-spark 1.4s ease-in-out infinite; } .ori-twinkle { animation: ori-twinkle 2.2s ease-in-out infinite alternate; } .ori-s2 { animation-delay: 0.35s; } .ori-s3 { animation-delay: 0.7s; } .ori-s4 { animation-delay: 1.05s; } .ori-z { opacity: 0; animation: ori-z 2.8s ease-in infinite; } .ori-z2 { animation-delay: 0.93s; } .ori-z3 { animation-delay: 1.86s; } .ori-mini { animation: ori-bob 2.2s ease-in-out infinite; } .ori-m2 { animation-delay: 0.5s; } .ori-m3 { animation-delay: 1s; } @keyframes ori-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } } @keyframes ori-hop { from { transform: translateY(0); } to { transform: translateY(-16px); } } @keyframes ori-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, 0.975); } } @keyframes ori-shake { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-4deg); } 84% { transform: rotate(3.5deg); } 92% { transform: rotate(-1.5deg); } } @keyframes ori-aura { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; } } @keyframes ori-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } } @keyframes ori-wave { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } } @keyframes ori-cheer { from { transform: translateY(0); } to { transform: translateY(-10px); } } @keyframes ori-tap { from { transform: translateY(0); } to { transform: translateY(-6px); } } @keyframes ori-glowp { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.3; } } @keyframes ori-peer { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, 3px); } } @keyframes ori-scan { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-6deg); } } @keyframes ori-scribble { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, 2px); } 50% { transform: translate(-2px, -2px); } 75% { transform: translate(-8px, 1px); } } @keyframes ori-present { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } } @keyframes ori-flash { 0%, 55% { opacity: 0; transform: scale(0.6); } 62% { opacity: 1; transform: scale(1); } 85%, 100% { opacity: 0; transform: scale(1.15); } } @keyframes ori-flag { from { transform: skewY(-10deg) scaleX(0.86); } to { transform: skewY(8deg) scaleX(1); } } @keyframes ori-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } } @keyframes ori-dot { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } } @keyframes ori-spark { 0%, 100% { transform: scale(0.25); opacity: 0.15; } 50% { transform: scale(1); opacity: 1; } } @keyframes ori-twinkle { from { opacity: 0.2; } to { opacity: 1; } } @keyframes ori-z { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(30px, -70px); opacity: 0; } } .ori-still *, @media (prefers-reduced-motion: reduce) { .ori * { animation: none !important; } }</style><defs><mask id="oriR0-shade"><rect width="400" height="400" fill="#fff"></rect><path d="M209.0 99.1 Q213.9 105.7 218.7 112.4 Q227.0 123.6 240.5 119.7 Q249.6 117.1 258.7 114.4 Q283.6 107.1 279.0 132.7 Q277.3 142.0 275.6 151.4 Q273.1 165.1 285.1 172.4 Q291.4 176.3 297.7 180.1 Q319.8 193.7 299.2 209.5 Q293.3 214.0 287.5 218.5 Q276.4 227.0 280.2 240.5 Q282.6 249.2 285.1 258.0 Q292.1 283.0 266.5 278.6 Q257.6 277.0 248.7 275.5 Q234.9 273.1 227.4 285.0 Q223.7 290.9 220.0 296.8 Q206.2 318.8 190.2 298.4 Q185.9 292.9 181.6 287.4 Q173.0 276.4 159.5 280.0 Q151.1 282.3 142.8 284.6 Q117.7 291.4 121.9 265.7 Q123.3 257.2 124.6 248.7 Q126.9 234.9 114.9 227.7 Q108.2 223.7 101.5 219.7 Q79.2 206.3 100.0 190.7 Q106.2 186.0 112.4 181.4 Q123.6 173.0 119.8 159.5 Q117.4 150.8 114.9 142.0 Q107.9 117.0 133.5 121.4 Q142.4 123.0 151.3 124.5 Q165.1 126.9 172.2 114.8 Q176.3 107.7 180.5 100.6 Q193.6 78.2 209.0 99.1Z" fill="#000" transform="translate(-13 -15)"></path></mask><radialGradient id="oriR0-glow"><stop offset="0" stop-color="#FFE6AE" stop-opacity=".28"></stop><stop offset="1" stop-color="#FFE6AE" stop-opacity="0"></stop></radialGradient><