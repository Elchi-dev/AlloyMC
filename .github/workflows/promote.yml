name: Promote to AlloyMC

# Publishes a release to the public repo: a one-commit snapshot of the tagged source and a
# GitHub release with the installers and update files from the Release workflow.
# Needs ALLOYMC_TOKEN: a fine-grained token with "Contents: read and write" on Elchi-dev/AlloyMC.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote, e.g. v0.2.0"
        required: true
      run_id:
        description: "Release workflow run id with the built artifacts"
        required: true
      ref:
        description: "Private branch, tag or commit to snapshot"
        required: false
        default: "main"

jobs:
  promote:
    if: github.repository == 'Elchi-dev/alloy'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - name: Snapshot source to AlloyMC
        env:
          TOKEN: ${{ secrets.ALLOYMC_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/Elchi-dev/AlloyMC.git" public
          cd public
          git rm -rqf . || true
          (cd ../src && git archive HEAD) | tar -x
          git add -A
          # The snapshot may already be there (pushed by hand); only commit real changes.
          git diff --cached --quiet || git -c user.name="Elchi" -c user.email="github@elchi.dev" commit -m "Alloy ${{ inputs.tag }}"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.tag }}" >/dev/null; then
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.ALLOYMC_TOKEN }}
        run: |
          version="${{ inputs.tag }}"
          awk -v v="## ${version#v}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' src/CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install (Windows)
          Download the `-setup.exe` and run it. It installs for your user, no admin prompt. The installer
          isn't code-signed yet, so SmartScreen may warn: **More info → Run anyway**.

          ### Install (Linux)
          Download the `.AppImage`, make it executable (`chmod +x`) and run it. Arch users can also build
          the package from `packaging/arch`.

          ### Update
          Already have Alloy? Download the `.alloyupdate` into your Downloads folder and click the gold
          update button in Alloy's sidebar.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$version" -R Elchi-dev/AlloyMC >/dev/null 2>&1; then
            gh release upload "$version" artifacts/* -R Elchi-dev/AlloyMC --clobber
          else
            gh release create "$version" artifacts/* -R Elchi-dev/AlloyMC --title "Alloy $version" --notes-file notes.md --prerelease
          fi
